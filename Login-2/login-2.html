<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZUZ - Login</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Qwigley&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="./login-2.css">
</head>

<body>

    <main class="page">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="login-block">

                <div class="avatar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                            fill="white"
                        />

                        <path
                            d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"
                            fill="white"
                        />
                    </svg>

                </div>

                <div class="login-text">

                    <div class="login-title">
                        Login
                    </div>

                    <div class="login-subtitle">
                        Minha Conta
                    </div>

                </div>

            </div>


            <!-- MENU -->
            <nav class="nav-menu">

                <!-- INÍCIO -->
                <a href="../index.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Início</span>
                </a>


                <!-- INSTRUÇÕES -->
                <a href="../introducao/intro.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Instruções</span>
                </a>


                <!-- PRODUTOS -->
                <a href="../produtos/produtos.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Produtos</span>
                </a>


                <!-- EQUIPE -->
                <a href="../equipe/equipe.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Equipe</span>
                </a>


                <!-- REFERÊNCIAS -->
                <a href="../referencias/refe.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Referências</span>
                </a>


                <!-- JOGO -->
                <a href="../jogo/jogo.html" class="nav-item">
                    <span class="nav-dot"></span>
                    <span>Jogo</span>
                </a>

            </nav>


            <!-- MODO CLARO / ESCURO -->
            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-pressed="false"
            >

                <span
                    class="theme-toggle-label"
                    id="themeLabel"
                >
                    Modo Claro
                </span>


                <span class="theme-toggle-knob">

                    <!-- SOL -->
                    <svg
                        id="iconSun"
                        class="theme-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle cx="12" cy="12" r="4"></circle>

                        <line x1="12" y1="2" x2="12" y2="4"></line>
                        <line x1="12" y1="20" x2="12" y2="22"></line>
                        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                        <line x1="2" y1="12" x2="4" y2="12"></line>
                        <line x1="20" y1="12" x2="22" y2="12"></line>
                        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>

                    </svg>


                    <!-- LUA -->
                    <svg
                        id="iconMoon"
                        class="theme-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        style="display: none;"
                    >

                        <path
                            d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"
                        ></path>

                        <line x1="18" y1="3" x2="18" y2="6"></line>
                        <line x1="16.5" y1="4.5" x2="19.5" y2="4.5"></line>

                    </svg>

                </span>

            </button>

        </aside>



        <!-- LADO ESQUERDO -->
        <section
            class="hero"
            aria-label="Boas-vindas ao ZUZ"
        >

            <div class="hero-copy">

                <div
                    class="hero-heading"
                    aria-label="Bem-vindo de volta ao ZUZ"
                >

                    <div class="hero-line hero-line-1">

                        <span class="hero-script">
                            Bem-vindo(a)
                        </span>

                        <span class="hero-bold hero-business">
                            de volta!
                        </span>

                    </div>


                    <div class="hero-bold hero-line-2">
                        Que bom ter você aqui.
                    </div>


                    <div class="hero-brand">
                        ZUZ
                    </div>

                </div>


                <p class="hero-description">
                    Acesse sua conta e continue tomando decisões mais inteligentes<br>
                    para o seu negócio, com mais clareza, estratégia e controle.
                </p>

            </div>

        </section>



        <!-- LADO DIREITO -->
        <section
            class="signup"
            aria-label="Fazer login"
        >

            <form
                class="signup-form"
                id="signupForm"
                novalidate
            >

                <!-- TÍTULO -->
                <header class="form-header">

                    <h1>
                        Acesse sua conta
                    </h1>

                    <p>
                        Digite seus dados para continuar.
                    </p>

                </header>


                <div class="divider"></div>



                <!-- NOME E SOBRENOME -->
                <div class="name-row">

                    <label class="field first-name">

                        <span>
                            Primeiro Nome
                        </span>

                        <input
                            type="text"
                            name="firstName"
                            placeholder="Ex. John"
                            autocomplete="given-name"
                        >

                    </label>


                    <label class="field last-name">

                        <span>
                            Sobrenome
                        </span>

                        <input
                            type="text"
                            name="lastName"
                            placeholder="Ex. Francisco"
                            autocomplete="family-name"
                        >

                    </label>

                </div>



                <!-- EMAIL -->
                <label class="field field-wide email-field">

                    <span>
                        Email
                    </span>

                    <input
                        type="email"
                        name="email"
                        placeholder="ex. johnfrans@gmail.com"
                        autocomplete="email"
                    >

                </label>



                <!-- SENHA -->
                <label class="field field-wide password-field">

                    <span>
                        Senha
                    </span>


                    <div class="password-wrap">

                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Digite sua senha"
                            minlength="8"
                            autocomplete="current-password"
                        >


                        <button
                            class="password-dot"
                            type="button"
                            aria-label="Mostrar ou ocultar senha"
                        ></button>

                    </div>


                    <small>
                        Deve ter pelo menos 8 caracteres
                    </small>

                </label>



                <!-- LOGIN -->
                <button
                    class="submit-button"
                    type="submit"
                >
                    Fazer Login
                </button>

            </form>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="./login-2.js"></script>

</body>

</html>
