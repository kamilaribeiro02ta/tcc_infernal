      <!-- MODO CLARO / ESCURO -->

    <!-- CONTEÚDO PRINCIPAL -->

      >

        <div class="team-carousel">

            class="team-arrow"
            id="teamPrev"
            type="button"
            aria-label="Integrante anterior"

            id="teamTrack"

  <!-- JAVASCRIPT -->
  <script>

    document.addEventListener("DOMContentLoaded", () => {

      /* ================================
         MODO CLARO / ESCURO
      ================================= */

      const themeToggle =
        document.getElementById("themeToggle");

      const themeLabel =
        document.getElementById("themeLabel");

      const iconSun =
        document.getElementById("iconSun");

      const iconMoon =
        document.getElementById("iconMoon");


      function applyTheme(theme) {

        const isDark =
          theme === "dark";


        document.body.classList.toggle(
          "dark",
          isDark
        );


        if (themeToggle) {

          themeToggle.setAttribute(
            "aria-pressed",
            String(isDark)
          );

        }


        if (themeLabel) {

          themeLabel.textContent =
            isDark
              ? "MODO ESCURO"
              : "MODO CLARO";

        }


        if (iconSun) {

          iconSun.style.display =
            isDark
              ? "none"
              : "block";

        }


        if (iconMoon) {

          iconMoon.style.display =
            isDark
              ? "block"
              : "none";

        }

      }


      const savedTheme =
        localStorage.getItem("zuz-theme") ||
        "light";


      applyTheme(savedTheme);


      if (themeToggle) {

        themeToggle.addEventListener(
          "click",
          () => {

            const isDark =
              document.body.classList.contains(
                "dark"
              );


            const newTheme =
              isDark
                ? "light"
                : "dark";


            localStorage.setItem(
              "zuz-theme",
              newTheme
            );


            applyTheme(newTheme);

          }
        );

      }


      /* ================================
         MENU ATIVO
      ================================= */

      const navItems =
        document.querySelectorAll(
          ".nav-item"
        );


      const currentPath =
        window.location.pathname;


      navItems.forEach((item) => {

        const href =
          item.getAttribute("href");


        if (!href) {
          return;
        }


        const link =
          new URL(
            href,
            window.location.href
          );


        item.classList.toggle(
          "active",
          link.pathname === currentPath
        );

      });


      /* ================================
         CARROSSEL
      ================================= */

      const teamTrack =
        document.getElementById("teamTrack");

      const teamPrev =
        document.getElementById("teamPrev");

      const teamNext =
        document.getElementById("teamNext");


      let moving = false;


      function moveCarousel(direction) {

        if (!teamTrack || moving) {
          return;
        }


        moving = true;


        const cards =
          teamTrack.querySelectorAll(
            ".member-card"
          );


        /* ANIMAÇÃO DE SAÍDA */

        cards.forEach((card) => {

          card.animate(
            [
              {
                opacity: 1,
                transform: "translateX(0)"
              },

              {
                opacity: 0.35,

                transform:
                  direction === "next"
                    ? "translateX(-28px)"
                    : "translateX(28px)"
              }
            ],

            {
              duration: 180,
              easing: "ease"
            }
          );

        });


        setTimeout(() => {


          /* DIREITA */

          if (direction === "next") {

            const firstCard =
              teamTrack.firstElementChild;


            if (firstCard) {

              teamTrack.appendChild(
                firstCard
              );

            }

          }


          /* ESQUERDA */

          if (direction === "prev") {

            const lastCard =
              teamTrack.lastElementChild;


            if (lastCard) {

              teamTrack.prepend(
                lastCard
              );

            }

          }


          /* ANIMAÇÃO DE ENTRADA */

          const newCards =
            teamTrack.querySelectorAll(
              ".member-card"
            );


          newCards.forEach((card) => {

            card.animate(
              [
                {
                  opacity: 0.35,

                  transform:
                    direction === "next"
                      ? "translateX(28px)"
                      : "translateX(-28px)"
                },

                {
                  opacity: 1,
                  transform: "translateX(0)"
                }
              ],

              {
                duration: 220,
                easing:
                  "cubic-bezier(0.22, 1, 0.36, 1)"
              }
            );

          });


          setTimeout(() => {

            moving = false;

          }, 220);


        }, 170);

      }


      /* SETA DIREITA */

      if (teamNext) {

        teamNext.addEventListener(
          "click",
          () => {

            moveCarousel("next");

          }
        );

      }


      /* SETA ESQUERDA */

      if (teamPrev) {

        teamPrev.addEventListener(
          "click",
          () => {

            moveCarousel("prev");

          }
        );

      }


      /* SETAS DO TECLADO */

      document.addEventListener(
        "keydown",
        (event) => {

          if (event.key === "ArrowRight") {

            moveCarousel("next");

          }


          if (event.key === "ArrowLeft") {

            moveCarousel("prev");

          }

        }
      );

    });

  </script>

</body>
